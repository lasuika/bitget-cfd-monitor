name: bitget-cfd-monitor

on:
  schedule:
    # Every 3 hours, not every 20 minutes. Only ONE run may sit pending per
    # concurrency group, so each new trigger cancels the one waiting — at */20
    # that is ~71 pointless cancellations a day, each a small window in which
    # the hand-off could land badly. The monitor job covers ~22 hours on its
    # own, so eight tries a day is already generous redundancy against
    # GitHub's scheduler, which took ~75 minutes to fire here at all.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test phone notification only'
        type: boolean
        default: false
      test_critical:
        description: 'Make the test an EMERGENCY alert (Pushover, repeats until acknowledged)'
        type: boolean
        default: false
      test_vibrate:
        description: 'Test the VIBRATE emergency path (repeats until ack, no sound)'
        type: boolean
        default: false
      test_healthcheck:
        description: 'Test the dead man switch: force it DOWN then back UP'
        type: boolean
        default: false
      my_equity:
        description: 'Override TraderEthan (trader 2) equity for this run (blank = use variable)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Workflow-level on purpose. Job-level concurrency plus a matrix means the
  # sibling legs share one group and cancel each other: leg 2 queuing evicted a
  # running leg 1 within 25 seconds of deploy. At workflow level the matrix
  # serializes via max-parallel alone — the shape that held a 5-hour leg
  # overnight. Schedule events leave the inputs context empty, so the group
  # expression safely resolves to 'cfd-monitor' there.
  group: >-
    ${{ (inputs.test == true || inputs.test_critical == true || inputs.test_vibrate == true || inputs.test_healthcheck == true)
        && format('oneoff-{0}', github.run_id) || 'cfd-monitor' }}
  cancel-in-progress: false

jobs:
  # Notification test, kept in its own job so it never queues behind the
  # 22-hour monitoring run — and so it fires once rather than once per leg.
  test:
    if: inputs.test == true || inputs.test_critical == true || inputs.test_vibrate == true || inputs.test_healthcheck == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # NB: `cond && '' || 'x'` always yields 'x' in GitHub expressions —
          # the empty string is falsy — so the negation form is required.
          TEST_ALERT: ${{ !(inputs.test_healthcheck == true) && '1' || '' }}
          TEST_CRITICAL: ${{ (inputs.test_critical == true || inputs.test_vibrate == true) && '1' || '' }}
          TEST_VIBRATE: ${{ inputs.test_vibrate == true && '1' || '' }}
          TEST_HEALTHCHECK: ${{ inputs.test_healthcheck == true && '1' || '' }}
          LOOP_MINUTES: '0'
        run: node monitor_ci.js

  # Four 5.5-hour legs run back to back: max-parallel 1 makes a matrix
  # sequential, so one trigger yields ~22 hours of unbroken coverage. A single
  # job is capped at 6 hours; a workflow is not, which is what makes this work.
  #
  # fail-fast is off deliberately — a crash in leg 2 must not take the rest of
  # the day's coverage with it.
  monitor:
    if: github.event_name == 'schedule' || (inputs.test != true && inputs.test_critical != true && inputs.test_vibrate != true && inputs.test_healthcheck != true)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Alert de-duplication, the equity anchor and his equity history all live
      # in state.json. Losing it re-fires alerts you have already dismissed, so
      # each leg picks up the newest snapshot any earlier leg wrote.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}-${{ matrix.leg }}
          restore-keys: |
            cfd-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Emergency channel — the only one that re-sends until acknowledged.
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          # Dead man's switch — an outside service that shouts when these pings
          # stop. Without it, the monitor dying looks exactly like a quiet market.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Set MY_EQUITY under Settings > Secrets and variables > Actions >
          # Variables after depositing. The dispatch input overrides it ad hoc.
          # One variable per copy account — each trader you follow gets its own
          # MT5 account, funded and sized independently, so each needs its own
          # equity figure for the cliff maths to mean anything.
          MY_EQUITY_1: ${{ vars.MY_EQUITY_1 }}
          MY_EQUITY_AT_1: ${{ vars.MY_EQUITY_AT_1 }}
          # The ad-hoc override points at trader 2 — the account with money in
          # it — not trader 1, which is watch-only.
          MY_EQUITY_2: ${{ inputs.my_equity != '' && inputs.my_equity || vars.MY_EQUITY_2 }}
          MY_EQUITY_AT_2: ${{ vars.MY_EQUITY_AT_2 }}
          # 320, not 330: the deadline is only checked between passes, and a
          # fully degraded pass (retry storms x2 traders) can run 20+ minutes —
          # 330 could overshoot the 350-minute job timeout and lose the final
          # state save.
          LOOP_MINUTES: '320'
        run: node monitor_ci.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}-${{ matrix.leg }}
