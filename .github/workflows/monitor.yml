name: bitget-cfd-monitor

on:
  schedule:
    # GitHub's scheduler is not something to lean on. This repo produced zero
    # schedule events in the first hour after going live, and the sibling
    # monitor saw a */5 cron fire every 67 minutes on average with gaps up to
    # 159. The monitor job below covers ~22 hours by itself, so this only has to
    # land once a day rather than every few hours.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test phone notification only'
        type: boolean
        default: false
      test_critical:
        description: 'Make the test an EMERGENCY alert (Pushover, repeats until acknowledged)'
        type: boolean
        default: false
      test_healthcheck:
        description: 'Test the dead man switch: force it DOWN then back UP'
        type: boolean
        default: false
      my_equity:
        description: 'Override your CFD equity for this run (0 = use variable)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Notification test, kept in its own job so it never queues behind the
  # 22-hour monitoring run — and so it fires once rather than once per leg.
  test:
    if: inputs.test == true || inputs.test_critical == true || inputs.test_healthcheck == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cfd-test-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          TEST_ALERT: ${{ inputs.test_healthcheck == true && '' || '1' }}
          TEST_CRITICAL: ${{ inputs.test_critical == true && '1' || '' }}
          TEST_HEALTHCHECK: ${{ inputs.test_healthcheck == true && '1' || '' }}
          LOOP_MINUTES: '0'
        run: node monitor_ci.js

  # Four 5.5-hour legs run back to back: max-parallel 1 makes a matrix
  # sequential, so one trigger yields ~22 hours of unbroken coverage. A single
  # job is capped at 6 hours; a workflow is not, which is what makes this work.
  #
  # fail-fast is off deliberately — a crash in leg 2 must not take the rest of
  # the day's coverage with it.
  monitor:
    if: github.event_name == 'schedule' || (inputs.test != true && inputs.test_critical != true && inputs.test_healthcheck != true)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: cfd-monitor
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Alert de-duplication, the equity anchor and his equity history all live
      # in state.json. Losing it re-fires alerts you have already dismissed, so
      # each leg picks up the newest snapshot any earlier leg wrote.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}-${{ matrix.leg }}
          restore-keys: |
            cfd-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Emergency channel — the only one that re-sends until acknowledged.
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          # Dead man's switch — an outside service that shouts when these pings
          # stop. Without it, the monitor dying looks exactly like a quiet market.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Set MY_EQUITY under Settings > Secrets and variables > Actions >
          # Variables after depositing. The dispatch input overrides it ad hoc.
          MY_EQUITY: ${{ inputs.my_equity != '' && inputs.my_equity || vars.MY_EQUITY }}
          MY_EQUITY_AT: ${{ vars.MY_EQUITY_AT }}
          LOOP_MINUTES: '330'
        run: node monitor_ci.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}-${{ matrix.leg }}
