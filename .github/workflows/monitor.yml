name: bitget-cfd-monitor

on:
  schedule:
    # Only has to keep one run queued behind the active one; the job itself
    # polls for 5.5 hours. */20 is plenty given GitHub fires these late anyway.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test phone notification only'
        type: boolean
        default: false
      test_critical:
        description: 'Make the test an EMERGENCY alert (Pushover, repeats until acknowledged)'
        type: boolean
        default: false
      my_equity:
        description: 'Override your CFD equity for this run (0 = use variable)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A one-off test must not sit in the queue behind the 50-minute loop.
  group: >-
    ${{ (inputs.test == true || inputs.test_critical == true)
        && format('oneoff-{0}', github.run_id) || 'cfd-monitor' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}
          restore-keys: |
            cfd-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Emergency channel — the only one that re-sends until acknowledged.
          # Absent, the monitor still runs but on ntfy alone.
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          # Set MY_EQUITY under Settings > Secrets and variables > Actions >
          # Variables after depositing. The dispatch input overrides it ad hoc.
          MY_EQUITY: ${{ inputs.my_equity != '' && inputs.my_equity || vars.MY_EQUITY }}
          MY_EQUITY_AT: ${{ vars.MY_EQUITY_AT }}
          TEST_ALERT: ${{ (inputs.test == true || inputs.test_critical == true) && '1' || '' }}
          TEST_CRITICAL: ${{ inputs.test_critical == true && '1' || '' }}
          # Actions minutes are unlimited on a public repo, so each run holds
          # its slot for 5.5 hours instead of 50 minutes. GitHub's cron is
          # unreliable — the sibling monitor saw gaps up to 159 minutes — and a
          # 50-minute loop leaves real holes between runs. A loop longer than any
          # observed gap means the queued run starts the moment this one ends, so
          # coverage stays continuous through the hours you are asleep.
          LOOP_MINUTES: ${{ (inputs.test == true || inputs.test_critical == true) && '0' || '330' }}
        run: node monitor_ci.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cfd-state-${{ github.run_id }}
